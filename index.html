<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Equipment v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:#090d14;color:#fff}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#0d1118;border-bottom:1px solid #263044}
.brand{font-weight:900;letter-spacing:2px}.brand span{font-weight:400;color:#93a0b8}
button,select{background:#171e2a;color:#fff;border:1px solid #344057;border-radius:9px;padding:9px 12px;cursor:pointer}
.app{height:calc(100% - 58px);display:grid;grid-template-columns:260px 1fr 260px}
aside{padding:15px;background:#10151e;border-right:1px solid #263044;overflow:auto}aside:last-child{border-right:0;border-left:1px solid #263044}
h3{font-size:11px;letter-spacing:1.3px;color:#8998b2}label{display:block;font-size:12px;color:#a9b4c7;margin:10px 0 6px}
select,input{width:100%}.card{padding:12px;background:#151c27;border:1px solid #2b364a;border-radius:10px;margin:10px 0}
.small{font-size:12px;color:#8290a8;line-height:1.45}#view{position:relative;min-width:0}canvas{display:block}
.hud{position:absolute;bottom:12px;left:12px;background:#0c111bcc;padding:8px 10px;border:1px solid #2c374b;border-radius:9px;color:#aab6ca;font-size:12px}
.full{width:100%;margin-top:8px}.danger{background:#2b171b;border-color:#5c3038}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<header><div class="brand">YOUR <span>EQUIPMENT</span></div><div><button id="reset">Sıfırla</button> <button id="save">Kaydet</button></div></header>
<div class="app">
<aside>
<h3>ÜRÜN KATALOĞU</h3>
<label>Kategori</label><select id="category"><option value="mouse">Mouse</option><option value="keyboard">Klavye</option><option value="monitor">Monitör</option><option value="mousepad">Mousepad</option></select>
<label>Marka</label><select id="brand"></select>
<label>Model</label><select id="model"></select>
<div class="card"><b id="productTitle"></b><div class="small">Şimdilik temsili 3D model. Gerçek GLB modellerini sonraki adımda bağlayacağız.</div></div>
<button id="addProduct" class="full">Masaya ekle</button>
<button data-quick="headset" class="full">🎧 Kulaklık ekle</button>
</aside>
<main id="view"><div class="hud">Boş alanda sürükle: kamera • Tekerlek: zoom • Ürünü sürükle: taşı</div></main>
<aside>
<h3>SEÇİLİ ÜRÜN</h3>
<div class="card"><b id="selectedName">Hiçbiri</b><div class="small">3D alanda bir ürüne tıkla.</div></div>
<label>Döndür</label><input id="rot" type="range" min="-180" max="180" value="0">
<label>Ürün rengi</label><input id="itemColor" type="color" value="#303a4a">
<label>Masa rengi</label><input id="deskColor" type="color" value="#6f4a32">
<button id="del" class="full danger">Seçili ürünü sil</button>
</aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const catalog={mouse:{"Attack Shark":["X3"],Razer:["Viper V3 Pro"],Logitech:["G Pro X Superlight 2"]},keyboard:{XVX:["M67"],Ajazz:["AK820 Pro"],Wooting:["60HE"]},monitor:{ASUS:["ROG 27"],MSI:["Gaming 27"],Lenovo:["Legion 25"]},mousepad:{Generic:["XL Deskmat","Speed Pad"]}};
const cat=document.getElementById("category"),br=document.getElementById("brand"),mo=document.getElementById("model"),title=document.getElementById("productTitle");
function sync(){br.innerHTML=Object.keys(catalog[cat.value]).map(x=>`<option>${x}</option>`).join("");syncM()}
function syncM(){mo.innerHTML=(catalog[cat.value][br.value]||[]).map(x=>`<option>${x}</option>`).join("");title.textContent=br.value+" "+mo.value}
cat.onchange=sync;br.onchange=syncM;mo.onchange=()=>title.textContent=br.value+" "+mo.value;sync();

const v=document.getElementById("view"),s=new THREE.Scene();s.background=new THREE.Color(0x090d14);
const c=new THREE.PerspectiveCamera(45,1,.1,100);c.position.set(5,4,6);
const r=new THREE.WebGLRenderer({antialias:true});r.shadowMap.enabled=true;v.prepend(r.domElement);
const ctr=new THREE.OrbitControls(c,r.domElement);ctr.enableDamping=true;ctr.target.set(0,1.1,0);
s.add(new THREE.HemisphereLight(0xcfe0ff,0x20283a,1.1));const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(4,7,3);s.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x121822}));floor.rotation.x=-Math.PI/2;s.add(floor);
const dm=new THREE.MeshStandardMaterial({color:0x6f4a32});const desk=new THREE.Mesh(new THREE.BoxGeometry(6.8,.25,3.2),dm);desk.position.y=1.65;s.add(desk);
for(const [x,z] of [[-2.7,-1],[2.7,-1],[-2.7,1],[2.7,1]]){const l=new THREE.Mesh(new THREE.BoxGeometry(.24,1.65,.24),new THREE.MeshStandardMaterial({color:0x252c37}));l.position.set(x,.82,z);s.add(l)}

let items=[],sel=null,drag=false;const ray=new THREE.Raycaster(),m=new THREE.Vector2(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),-1.82);
const mat=h=>new THREE.MeshStandardMaterial({color:h,roughness:.5});
function wrap(t,b,md){const g=new THREE.Group();g.userData={t,b,md,name:b+" "+md,drag:true};return g}
function make(t,b,md){
 let g=wrap(t,b,md);
 if(t==="mouse"){let x=new THREE.Mesh(new THREE.SphereGeometry(.22,24,16),mat(0x303a4a));x.scale.set(.78,.38,1.12);x.position.y=.1;g.add(x)}
 if(t==="keyboard"){let w=md.includes("M67")||md.includes("60HE")?1.45:1.8;g.add(new THREE.Mesh(new THREE.BoxGeometry(w,.12,.62),mat(0x303a4a)))}
 if(t==="monitor"){let f=new THREE.Mesh(new THREE.BoxGeometry(2.15,1.25,.11),mat(0x242c39));f.position.y=.85;g.add(f);let sc=new THREE.Mesh(new THREE.BoxGeometry(1.93,1.03,.025),mat(0x05070a));sc.position.set(0,.85,.07);g.add(sc);let st=new THREE.Mesh(new THREE.BoxGeometry(.12,.72,.12),mat(0x252c37));st.position.y=.25;g.add(st)}
 if(t==="mousepad")g.add(new THREE.Mesh(new THREE.BoxGeometry(md.includes("XL")?3.2:2.4,.035,1.25),mat(0x202837)));
 if(t==="headset"){let x=new THREE.Mesh(new THREE.TorusGeometry(.38,.055,12,36,Math.PI),mat(0x303a4a));x.rotation.z=Math.PI;x.position.y=.35;g.add(x)}
 return g
}
function add(t,b,md){const o=make(t,b,md);let y=1.86;if(t==="monitor")o.position.set(0,1.83,-.75);if(t==="keyboard")o.position.set(-.4,y,.35);if(t==="mouse")o.position.set(1.15,y,.45);if(t==="mousepad")o.position.set(.2,1.8,.35);if(t==="headset")o.position.set(2,y,-.5);s.add(o);items.push(o);select(o)}
function select(o){sel=o;document.getElementById("selectedName").textContent=o?o.userData.name:"Hiçbiri"}
document.getElementById("addProduct").onclick=()=>add(cat.value,br.value,mo.value);
document.querySelector("[data-quick]").onclick=()=>add("headset","Generic","Headset");
function pt(e){const b=r.domElement.getBoundingClientRect();m.x=(e.clientX-b.left)/b.width*2-1;m.y=-(e.clientY-b.top)/b.height*2+1}
r.domElement.onpointerdown=e=>{pt(e);ray.setFromCamera(m,c);let h=ray.intersectObjects(items,true);if(h.length){let o=h[0].object;while(o.parent&&!o.userData.drag)o=o.parent;if(o.userData.drag){select(o);drag=true;ctr.enabled=false}}}
r.domElement.onpointermove=e=>{if(!drag||!sel)return;pt(e);ray.setFromCamera(m,c);let p=new THREE.Vector3();if(ray.ray.intersectPlane(pl,p)){sel.position.x=Math.max(-3,Math.min(3,p.x));sel.position.z=Math.max(-1.25,Math.min(1.25,p.z))}}
window.onpointerup=()=>{drag=false;ctr.enabled=true}
document.getElementById("rot").oninput=e=>{if(sel)sel.rotation.y=THREE.MathUtils.degToRad(+e.target.value)}
document.getElementById("deskColor").oninput=e=>dm.color.set(e.target.value)
document.getElementById("itemColor").oninput=e=>{if(sel)sel.traverse(o=>{if(o.isMesh&&o.material?.color)o.material.color.set(e.target.value)})}
document.getElementById("del").onclick=()=>{if(sel){s.remove(sel);items=items.filter(x=>x!==sel);select(null)}}
document.getElementById("reset").onclick=()=>{items.forEach(x=>s.remove(x));items=[];select(null);localStorage.removeItem("ye3")}
document.getElementById("save").onclick=()=>{localStorage.setItem("ye3",JSON.stringify(items.map(x=>({t:x.userData.t,b:x.userData.b,md:x.userData.md,p:x.position.toArray(),r:x.rotation.y}))));alert("Kaydedildi")}
const saved=localStorage.getItem("ye3");if(saved){try{for(const d of JSON.parse(saved)){add(d.t,d.b,d.md);sel.position.fromArray(d.p);sel.rotation.y=d.r}select(null)}catch(e){}}else{add("mousepad","Generic","XL Deskmat");add("monitor","ASUS","ROG 27");add("keyboard","Ajazz","AK820 Pro");add("mouse","Attack Shark","X3");select(null)}
function resize(){r.setSize(v.clientWidth,v.clientHeight);c.aspect=v.clientWidth/v.clientHeight;c.updateProjectionMatrix()}window.onresize=resize;resize();
(function loop(){requestAnimationFrame(loop);ctr.update();r.render(s,c)})()
</script>
</body></html>
